<text class="k" x="46" y="42">CAREZ / NAVIGATION DECISION / CONCEPT COMPARISON</text>
<text class="h" x="46" y="82">Same seven surfaces. Different space for the work.</text>
<text class="s" x="46" y="107">Schematic concepts based on the current local shell and accepted ADR-026; content is illustrative.</text>
