name: Carez OS Validation

on:
  push:
    branches:
      - main
      - staging
      - 'carez-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carez-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      PLAID_CLIENT_ID: ci-placeholder
      PLAID_SECRET: ci-placeholder-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Domain tests
        run: pnpm test
      - name: Build
        run: pnpm build

# staging/main are permanent; carez-* is reserved for exceptional temporary implementation branches.
