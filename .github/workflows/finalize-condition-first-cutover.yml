name: Finalize condition-first Takeoff cutover

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/finalize-condition-first-cutover.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      PLAID_CLIENT_ID: ci-placeholder
      PLAID_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply final lifecycle guards
        run: python3 scripts/finalize-condition-first-cutover.py
      - name: Typecheck
        run: pnpm typecheck
      - name: Domain tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Remove one-shot assets
        run: |
          rm scripts/finalize-condition-first-cutover.py
          rm .github/workflows/finalize-condition-first-cutover.yml
      - name: Commit validated cutover
        run: |
          git config user.name "carez-automation"
          git config user.email "117563283+seancolmes@users.noreply.github.com"
          git add -A
          git commit -m "fix(takeoff): finalize Condition-first legacy authoring cutover"
          git push origin HEAD:staging
