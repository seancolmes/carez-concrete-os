name: Apply condition-first Takeoff cutover

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/apply-condition-first-cutover.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source changes
        run: |
          node scripts/retire-active-legacy-takeoff-authoring.mjs
          node scripts/activate-condition-first-takeoff-shell.mjs
      - name: Remove one-shot patch assets
        run: |
          rm scripts/retire-active-legacy-takeoff-authoring.mjs
          rm scripts/activate-condition-first-takeoff-shell.mjs
          rm .github/workflows/apply-condition-first-cutover.yml
      - name: Commit cutover
        run: |
          git config user.name "carez-automation"
          git config user.email "117563283+seancolmes@users.noreply.github.com"
          git add -A
          git commit -m "feat(takeoff): retire active legacy authoring behind Condition gate"
          git push origin HEAD:staging
