name: Apply Takeoff Scale Regions

on:
  push:
    branches:
      - carez-takeoff-scale-regions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      PLAID_CLIENT_ID: ci-placeholder
      PLAID_SECRET: ci-placeholder-secret
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: carez-takeoff-scale-regions
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Assemble feature sources
        run: |
          cat scripts/scale-feature-actions.part-* > 'app/takeoff/[setId]/actions.ts'
          cat scripts/scale-feature-scale-regions.part-* > lib/takeoff/scaleRegions.ts
          cat scripts/scale-feature-patch.part-* > /tmp/apply-takeoff-scale-regions.py

      - name: Create migration shell
        run: |
          npx --yes supabase@latest migration new --help > /tmp/supabase-migration-help.txt
          npx --yes supabase@latest migration new takeoff_scale_regions
          migration="$(ls -1 supabase/migrations/*_takeoff_scale_regions.sql | tail -1)"
          cat scripts/scale-feature-migration.part-* > "$migration"

      - name: Apply source patches
        run: python3 /tmp/apply-takeoff-scale-regions.py

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify patch
        run: |
          git diff --check
          git status --short

      - name: Commit verified feature
        run: |
          rm -f scripts/scale-feature-actions.part-*
          rm -f scripts/scale-feature-scale-regions.part-*
          rm -f scripts/scale-feature-patch.part-*
          rm -f scripts/scale-feature-migration.part-*
          rm -f .github/workflows/apply-takeoff-scale-regions.yml
          git config user.name "Carez Release Automation"
          git config user.email "117563283+seancolmes@users.noreply.github.com"
          git add -A
          git commit -m "feat(takeoff): add confirmed PDF scale regions"
          git push origin HEAD:carez-takeoff-scale-regions
