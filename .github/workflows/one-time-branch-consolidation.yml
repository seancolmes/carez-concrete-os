name: One-time branch consolidation

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete all non-permanent remote branches
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin \
            | awk '{sub("refs/heads/", "", $2); print $2}' \
            | while IFS= read -r branch; do
                case "$branch" in
                  main|staging) continue ;;
                esac
                echo "Deleting stale branch: $branch"
                git push origin --delete "$branch"
              done

      - name: Verify permanent branch set
        shell: bash
        run: |
          set -euo pipefail
          branches="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)"
          printf '%s\n' "$branches"
          test "$branches" = $'main\nstaging'
